name: Release

# Push a tag such as v1.1.0 to build a Universal, ad-hoc signed app and publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" CoreRemote/Info.plist)
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $PLIST_VERSION"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project CoreRemote.xcodeproj -scheme CoreRemote -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          lipo -archs build/Build/Products/Release/CoreRemote.app/Contents/MacOS/CoreRemote

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/CoreRemote.app "CoreRemote-${GITHUB_REF_NAME#v}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "CoreRemote-${GITHUB_REF_NAME#v}.zip" \
            --title "CoreRemote ${GITHUB_REF_NAME#v}" --generate-notes
