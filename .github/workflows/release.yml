name: Release
run-name: "release: ${{ github.ref_name }}"

# Push a tag such as v1.1.0 to build a Universal, ad-hoc signed app and publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Check version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" CoreRemote/Info.plist)
          if [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $PLIST_VERSION"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project CoreRemote.xcodeproj -scheme CoreRemote -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          lipo -archs build/Build/Products/Release/CoreRemote.app/Contents/MacOS/CoreRemote

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/CoreRemote.app "CoreRemote-${GITHUB_REF_NAME#v}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "CoreRemote-${GITHUB_REF_NAME#v}.zip" \
            --title "CoreRemote ${GITHUB_REF_NAME#v}" --generate-notes

      # Points meteciftci/homebrew-tap at the new zip. HOMEBREW_TAP_TOKEN is a fine-grained
      # token with Contents read and write on that repository only.
      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "CoreRemote-$VERSION.zip" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/meteciftci/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/coreremote.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update coreremote to $VERSION"
          git push
