name: CoreRemote
options:
  bundleIdPrefix: com.meteciftci
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

# Signing lives in Config/Signing.xcconfig (+ optional, untracked Config/Local.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  CoreRemote:
    type: application
    platform: macOS
    sources:
      - path: CoreRemote
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: CoreRemote/Info.plist
      properties:
        CFBundleDisplayName: CoreRemote
        NSAppleEventsUsageDescription: CoreRemote opens SSH connections in a new iTerm2 window.
        CFBundleShortVersionString: "1.4.1"
        CFBundleVersion: "9"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Mete Çiftçi"
        CFBundleLocalizations: [en, tr]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.meteciftci.coreremote.backup
            UTTypeDescription: CoreRemote Backup
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [coreremote]
        CFBundleURLTypes:
          - CFBundleURLName: com.meteciftci.CoreRemote.connect
            CFBundleURLSchemes: [coreremote]
        CFBundleDocumentTypes:
          - CFBundleTypeName: CoreRemote Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.meteciftci.coreremote.backup]
    entitlements:
      path: CoreRemote/CoreRemote.entitlements
      properties:
        # Lets the hardened runtime send Apple Events, used to open SSH sessions in iTerm2.
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteciftci.CoreRemote
        PRODUCT_NAME: CoreRemote
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  CoreRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CoreRemoteTests
    dependencies:
      - target: CoreRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meteciftci.CoreRemoteTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CoreRemote.app/Contents/MacOS/CoreRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CoreRemote:
    build:
      targets:
        CoreRemote: all
        CoreRemoteTests: [test]
    test:
      targets:
        - CoreRemoteTests
